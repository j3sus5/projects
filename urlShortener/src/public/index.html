<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URL Shortener</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 680px;
    margin: 70px auto;
    padding: 0 24px;
    background: #fafafa;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  header {
    margin-bottom: 36px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px 0;
  }
  .sub {
    color: #737373;
    font-size: 14px;
  }
  .box {
    background: #ffffff;
    border: 1px solid #e2e2e2;
    padding: 24px;
    margin-bottom: 32px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #737373;
    margin-bottom: 8px;
  }
  form {
    display: flex;
    gap: 10px;
  }
  input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid #d4d4d4;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    transition: border-color 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: #1a1a1a;
  }
  input::placeholder {
    color: #b3b3b3;
  }
  button {
    padding: 11px 22px;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #1a1a1a;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
  }
  button:hover {
    background: #000;
  }
  button:active {
    transform: translateY(1px);
  }
  #result {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #eee;
    font-size: 14px;
    display: none;
  }
  #result.visible {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #result a {
    color: #1a1a1a;
    font-weight: 600;
    text-decoration: none;
  }
  #result a:hover {
    text-decoration: underline;
  }
  #result button {
    padding: 6px 12px;
    font-size: 12px;
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #d4d4d4;
  }
  #result button:hover {
    background: #f5f5f5;
  }
  .error {
    color: #c0392b;
    margin-top: 12px;
    font-size: 13px;
  }
  h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #737373;
    margin-bottom: 12px;
  }
  .table-box {
    background: #ffffff;
    border: 1px solid #e2e2e2;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th {
    text-align: left;
    padding: 12px 16px;
    background: #f7f7f7;
    border-bottom: 1px solid #e2e2e2;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #737373;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  tr:last-child td {
    border-bottom: none;
  }
  td a {
    color: #1a1a1a;
    font-weight: 600;
    text-decoration: none;
  }
  td a:hover {
    text-decoration: underline;
  }
  .url-cell {
    color: #555;
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .clicks-cell {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: #1a1a1a;
    font-weight: 600;
  }
  .empty {
    color: #999;
    text-align: center;
    padding: 28px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>URL Shortener</h1>
  <div class="sub">Shorten a link and track its clicks.</div>
</header>

<div class="box">
  <label for="url-input">Long URL</label>
  <form id="shorten-form">
    <input type="url" id="url-input" placeholder="https://example.com/a-very-long-link" required />
    <button type="submit">Shorten</button>
  </form>
  <div id="result"></div>
  <div id="error" class="error"></div>
</div>

<h2>Your Links</h2>
<div class="table-box">
  <table>
    <thead>
      <tr><th>Code</th><th>URL</th><th style="text-align:right">Clicks</th></tr>
    </thead>
    <tbody id="links-body">
      <tr><td colspan="3" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script src="/dashboard.js"></script>
</body>
</html>
